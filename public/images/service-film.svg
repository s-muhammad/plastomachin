<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="filmTitle">
  <title id="filmTitle">تصویر جایگزین دستگاه تولید نایلون</title>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092747"/>
      <stop offset="1" stop-color="#1b588b"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff4ff" stop-opacity=".15"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#b9dff3" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#b)"/>
  <g opacity=".25" stroke="#6ca7d4" stroke-width="2">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200"/>
    <path d="M120 0v700M320 0v700M520 0v700M720 0v700M920 0v700M1120 0v700"/>
  </g>
  <circle cx="900" cy="120" r="220" fill="#f6a21a" opacity=".08"/>
