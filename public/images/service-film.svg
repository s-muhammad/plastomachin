    <rect x="420" y="150" width="26" height="420" fill="#3f85b9"/>
    <rect x="720" y="150" width="26" height="420" fill="#3f85b9"/>
    <rect x="400" y="150" width="366" height="22" rx="6" fill="#2a6b9f"/>
    <rect x="400" y="530" width="366" height="26" rx="6" fill="#2a6b9f"/>
    <rect x="440" y="80" width="286" height="18" rx="6" fill="#5a9aca"/>
    <path d="M470 110c-18 50-24 100-20 150 4 56 26 96 58 120h152c32-24 54-64 58-120 4-50-2-100-20-150z" fill="url(#bubble)" stroke="#e0f4ff" stroke-opacity=".3" stroke-width="3"/>
    <path d="M500 130c-14 44-18 88-14 130" stroke="#fff" stroke-opacity=".6" stroke-width="9" fill="none"/>
    <rect x="440" y="400" width="290" height="24" rx="10" fill="#1a4e79"/>
    <circle cx="520" cy="500" r="40" fill="#0b2a4a" stroke="#6ca7d4" stroke-width="3"/>
    <circle cx="520" cy="500" r="10" fill="#f6a21a"/>
    <circle cx="660" cy="500" r="40" fill="#0b2a4a" stroke="#6ca7d4" stroke-width="3"/>
    <circle cx="660" cy="500" r="10" fill="#f6a21a"/>
  </g>
