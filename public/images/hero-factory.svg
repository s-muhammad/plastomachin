<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">تصویر جایگزین کارخانه تولید نایلون</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2b4d"/>
      <stop offset=".55" stop-color="#0d355c"/>
      <stop offset="1" stop-color="#061a2e"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123b63"/>
      <stop offset="1" stop-color="#071e35"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d5b93"/>
      <stop offset=".45" stop-color="#4b8fc4"/>
      <stop offset="1" stop-color="#123f6a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb730"/>
      <stop offset="1" stop-color="#e58a00"/>
    </linearGradient>
    <radialGradient id="roll" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#d9ecfa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#86b6d8" stop-opacity=".8"/>
    </radialGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".35" stop-color="#e8f7ff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#b9dff5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d7efff" stop-opacity=".08"/>
      <stop offset=".3" stop-color="#d7efff" stop-opacity=".5"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9dd0ee" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="shadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset=".35" stop-color="#071c33" stop-opacity="0"/>
      <stop offset=".72" stop-color="#071c33" stop-opacity=".7"/>
      <stop offset="1" stop-color="#071c33" stop-opacity=".96"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>

  <!-- factory wall -->
  <g opacity=".5">
    <rect x="0" y="70" width="1600" height="620" fill="#0b2f53"/>
    <g fill="#123f69" stroke="#2a6394" stroke-width="2">
      <rect x="70" y="110" width="260" height="190" rx="6"/>
      <rect x="360" y="110" width="260" height="190" rx="6"/>
      <rect x="650" y="110" width="260" height="190" rx="6"/>
      <rect x="940" y="110" width="260" height="190" rx="6"/>
      <rect x="1230" y="110" width="260" height="190" rx="6"/>
    </g>
    <g stroke="#3f79aa" stroke-width="4" opacity=".55">
      <path d="M70 150h260M70 190h260M70 230h260M70 270h260"/>
      <path d="M360 150h260M360 190h260M360 230h260M360 270h260"/>
      <path d="M650 150h260M650 190h260M650 230h260M650 270h260"/>
      <path d="M940 150h260M940 190h260M940 230h260M940 270h260"/>
      <path d="M1230 150h260M1230 190h260M1230 230h260M1230 270h260"/>
    </g>
  </g>

  <!-- ceiling lights -->
  <g opacity=".65">
    <rect x="170" y="20" width="330" height="16" rx="8" fill="#dff6ff"/>
    <rect x="620" y="20" width="330" height="16" rx="8" fill="#dff6ff"/>
    <rect x="1070" y="20" width="330" height="16" rx="8" fill="#dff6ff"/>
    <path d="M170 36h330l100 260H70z" fill="#bfe9ff" opacity=".05"/>
    <path d="M620 36h330l100 260H520z" fill="#bfe9ff" opacity=".05"/>
    <path d="M1070 36h330l100 260H970z" fill="#bfe9ff" opacity=".05"/>
  </g>

  <!-- floor -->
  <path d="M0 640h1600v310H0z" fill="url(#floor)"/>
  <g stroke="#2a5b87" stroke-width="2" opacity=".35">
    <path d="M0 700h1600M0 780h1600M0 880h1600"/>
    <path d="M800 640 610 950M800 640 390 950M800 640 990 950M800 640 1230 950M800 640 90 950M800 640 1490 950"/>
  </g>

  <!-- machine frame -->
  <g>
    <!-- back vertical posts -->
    <rect x="100" y="190" width="30" height="520" rx="4" fill="url(#steel)"/>
    <rect x="338" y="150" width="26" height="560" rx="4" fill="url(#steel)"/>
    <rect x="556" y="190" width="30" height="520" rx="4" fill="url(#steel)"/>
    <rect x="786" y="210" width="30" height="500" rx="4" fill="url(#steel)"/>
    <!-- cross beams -->
    <rect x="100" y="190" width="716" height="24" rx="4" fill="url(#steel)"/>
    <rect x="100" y="360" width="716" height="20" rx="4" fill="#28679f"/>
    <rect x="100" y="540" width="716" height="22" rx="4" fill="url(#steel)"/>
    <rect x="100" y="690" width="716" height="26" rx="4" fill="#123f6a"/>
    <!-- diagonal braces -->
    <path d="M120 214 330 536M348 174 560 540M576 214 780 526" stroke="#3b7cb0" stroke-width="10" opacity=".55"/>
    <!-- orange accents -->
    <rect x="100" y="402" width="716" height="7" fill="url(#orange)" opacity=".9"/>
    <rect x="100" y="664" width="716" height="7" fill="url(#orange)" opacity=".8"/>
    <!-- motors / gearboxes -->
    <rect x="120" y="565" width="95" height="92" rx="8" fill="#0c3458" stroke="#3d7db0" stroke-width="3"/>
    <circle cx="167" cy="611" r="28" fill="#15456f" stroke="#6ca8d8" stroke-width="3"/>
    <circle cx="167" cy="611" r="9" fill="#f6a21a"/>
    <rect x="414" y="575" width="104" height="80" rx="8" fill="#0c3458" stroke="#3d7db0" stroke-width="3"/>
    <path d="M438 615h56M466 587v56" stroke="#77b4df" stroke-width="4"/>
    <!-- control panel -->
    <rect x="590" y="560" width="130" height="100" rx="8" fill="#081f37" stroke="#3474a8" stroke-width="3"/>
    <rect x="606" y="576" width="98" height="36" rx="4" fill="#0c3b60"/>
    <g fill="#4bd18a"><circle cx="618" cy="640" r="5"/></g>
    <g fill="#f6a21a"><circle cx="636" cy="640" r="5"/></g>
    <g fill="#7fbbe5"><circle cx="654" cy="640" r="5"/></g>
    <rect x="674" y="630" width="20" height="22" rx="3" fill="#164c78"/>
  </g>

  <!-- blown film bubble -->
  <g>
    <path d="M620 175c-40 60-56 130-56 200 0 80 22 140 62 180h166c40-40 62-100 62-180 0-70-16-140-56-200z" fill="url(#bubble)" stroke="#d8f1ff" stroke-opacity=".28" stroke-width="3"/>
    <path d="M650 192c-20 60-26 118-24 174" stroke="#ffffff" stroke-opacity=".55" stroke-width="10" fill="none"/>
    <path d="M776 200c18 54 24 110 22 164" stroke="#ffffff" stroke-opacity=".25" stroke-width="8" fill="none"/>
    <rect x="600" y="520" width="230" height="22" rx="8" fill="#1c517c"/>
    <rect x="620" y="490" width="18" height="30" fill="#3f7dab"/>
    <rect x="790" y="490" width="18" height="30" fill="#3f7dab"/>
  </g>

  <!-- film web to rollers -->
  <path d="M648 196c-110 40-250 120-330 250-60 96-34 180 80 200 40 7 104-2 176-30-90 10-130-18-110-60 34-70 150-166 252-210z" fill="url(#film)" opacity=".92"/>

  <!-- big film roll -->
  <g>
    <circle cx="286" cy="620" r="136" fill="#092743" opacity=".9"/>
    <circle cx="286" cy="620" r="130" fill="url(#roll)"/>
    <circle cx="286" cy="620" r="126" fill="none" stroke="#ffffff" stroke-opacity=".65" stroke-width="4"/>
    <circle cx="286" cy="620" r="100" fill="none" stroke="#7ba9c9" stroke-opacity=".45" stroke-width="3"/>
    <circle cx="286" cy="620" r="74" fill="none" stroke="#7ba9c9" stroke-opacity=".35" stroke-width="3"/>
    <circle cx="286" cy="620" r="34" fill="#0a2947" stroke="#cfe8fa" stroke-width="5"/>
    <circle cx="286" cy="620" r="15" fill="#f6a21a"/>
    <path d="M230 530c80-30 160 20 176 104" stroke="#ffffff" stroke-opacity=".55" stroke-width="8" fill="none"/>
  </g>

  <!-- secondary roll on floor -->
  <g opacity=".9">
    <ellipse cx="1040" cy="790" rx="165" ry="52" fill="#05192c" opacity=".55"/>
    <rect x="900" y="650" width="280" height="140" rx="70" fill="#dcecf7"/>
    <ellipse cx="1180" cy="720" rx="42" ry="70" fill="#a9cbe0"/>
    <ellipse cx="900" cy="720" rx="42" ry="70" fill="#f3fbff" opacity=".85"/>
    <ellipse cx="1040" cy="720" rx="80" ry="70" fill="#c9e2f1" opacity=".5"/>
  </g>

  <!-- small pallets -->
  <g opacity=".7">
    <rect x="1240" y="690" width="250" height="24" fill="#7b5b38"/>
    <rect x="1256" y="650" width="220" height="40" fill="#d8e7f1"/>
    <rect x="1268" y="610" width="196" height="40" fill="#c2d9e8"/>
  </g>

  <!-- right side shade for text -->
  <rect width="1600" height="950" fill="url(#shadeRight)"/>
  <rect width="1600" height="950" fill="url(#bg)" opacity=".18"/>
</svg>
