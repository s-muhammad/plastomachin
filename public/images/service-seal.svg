<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="sealTitle">
  <title id="sealTitle">تصویر جایگزین دستگاه دوخت و برش نایلون</title>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a4a"/>
      <stop offset="1" stop-color="#154b78"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#b)"/>
  <g opacity=".22" stroke="#6ca7d4" stroke-width="2">
    <path d="M0 130h1200M0 260h1200M0 390h1200M0 520h1200M0 650h1200"/>
    <path d="M160 0v700M360 0v700M560 0v700M760 0v700M960 0v700M1160 0v700"/>
  </g>
  <circle cx="200" cy="600" r="220" fill="#25d366" opacity=".05"/>
  <!-- sealing machine -->
  <g>
    <rect x="240" y="250" width="720" height="150" rx="30" fill="#0b2038" stroke="#3f85b9" stroke-width="4"/>
    <rect x="300" y="300" width="600" height="50" rx="24" fill="#dcecf7" opacity=".92"/>
    <rect x="300" y="330" width="600" height="8" fill="#f6a21a"/>
    <g fill="#0b2a4a">
