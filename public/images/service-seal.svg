      <circle cx="870" cy="440" r="26"/>
    </g>
    <g fill="#3f85b9">
      <circle cx="330" cy="440" r="9"/>
      <circle cx="870" cy="440" r="9"/>
    </g>
    <rect x="420" y="190" width="360" height="50" rx="18" fill="#1d5b8e"/>
    <rect x="470" y="140" width="260" height="30" rx="12" fill="#2f76aa"/>
