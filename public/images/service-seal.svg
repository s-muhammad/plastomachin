  <path d="M1020 210v260" stroke="#f6a21a" stroke-width="5" stroke-dasharray="14 12"/>
  <!-- bags -->
  <g fill="#e5f2fa" opacity=".9">
    <path d="M980 480h160v150c0 16-10 26-26 26h-108c-16 0-26-10-26-26z"/>
    <path d="M980 480l80 40 80-40" fill="none" stroke="#a9cbe0" stroke-width="4"/>
  </g>
  <g stroke="#7aa7c4" stroke-width="3" opacity=".5">
